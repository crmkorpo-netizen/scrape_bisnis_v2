name: Scraping Otomatis Bisnis.com

on:
  schedule:
    - cron: '17 */4 * * *'  # Mengubah menit ke 17 untuk menghindari antrean sibuk jam genap GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install curl-cffi beautifulsoup4 pandas lxml openpyxl
          
      - name: Run scraper
        run: python scraper.py
        
      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Cek apakah ada file baru yang dihasilkan oleh scraper
          git add Bisnis_*.xlsx
          
          # Jika ada perubahan, lakukan commit dan penggabungan aman (rebase) sebelum push
          if ! git diff --staged --quiet; then
            git commit -m "Update scraped data $(date +'%Y-%m-%d %H:%M:%S')"
            git pull origin main --rebase
            git push origin main
          else
            echo "Tidak ada data baru yang berubah, melewati proses push."
          fi
